name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Run tests
        run: |
          composer install --no-interaction --prefer-dist
          composer lint
          composer test

      - name: Build plugin zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/pkg/rest-filter
          git archive --format=tar HEAD | tar -x -C /tmp/pkg/rest-filter
          cd /tmp/pkg
          zip -qr "$GITHUB_WORKSPACE/rest-filter-v${version}.zip" rest-filter
          cd "$GITHUB_WORKSPACE"
          sha256sum "rest-filter-v${version}.zip" > "rest-filter-v${version}.zip.sha256"
          unzip -l "rest-filter-v${version}.zip"
          cat "rest-filter-v${version}.zip.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: rest-filter-v*.zip*
          generate_release_notes: true
